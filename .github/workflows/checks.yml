name: Offline regression and publication checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Scan clean source checkout
        run: python tools/check_publication.py
      - name: Scan actual Git index blobs
        run: python tools/check_publication.py --staged
      - name: Publication boundary regressions
        run: python -m unittest discover -s tests -p test_publication_policy.py -v

  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Sixteen offline classification regressions
        run: python -m unittest discover -s tests -p test_regressions.py -v
      - name: Synthetic CPU demo
        run: python -m job_text_classification demo
